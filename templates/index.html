<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Room Simulation</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; background:#111; color:#eee; }
  #sidebar { width: 340px; overflow-y: auto; padding: 12px; background:#181818; border-right:1px solid #333; }
  #main { flex: 1; display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:16px; font-size:14px; line-height:1.5; }
  .char-card { background:#222; border-radius:8px; padding:10px; margin-bottom:10px; }
  .char-card.dead { opacity:0.5; }
  .bar { height:6px; border-radius:3px; background:#333; margin:4px 0; overflow:hidden; }
  .bar-fill { height:100%; }
  .health-fill { background:#5cb85c; }
  .stability-fill { background:#5bc0de; }
  .btn { font-size:12px; padding:4px 8px; margin:2px 2px 0 0; border-radius:4px; border:1px solid #444; background:#2a2a2a; color:#eee; cursor:pointer; }
  .btn:hover { background:#3a3a3a; }
  .btn-danger { border-color:#5a2a2a; color:#e08080; }
  .btn-danger:hover { background:#3a1f1f; }
  .mem-snippet { font-size:11px; color:#888; margin:4px 0; font-style:italic; }
  .line { margin-bottom:8px; }
  .line .who { font-weight:600; }
  .kind-thought { color:#888; font-style:italic; }
  .kind-system, .kind-death { color:#e0a020; }
  .kind-intervention { color:#e05050; }
  #topbar { padding:8px 16px; background:#181818; border-bottom:1px solid #333; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #focusBar { padding:6px 16px; background:#1c1710; border-bottom:1px solid #332a1a; font-size:12px; color:#d9a860; }
  input, textarea { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:4px; width:100%; box-sizing:border-box; margin:2px 0; font-family:inherit; }
  h3 { margin: 10px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:#888; }
  #focusDisplay { font-size:12px; color:#aaa; margin-bottom:6px; line-height:1.4; }
</style>
</head>
<body>

<div id="sidebar">
  <h3>Setting</h3>
  <div id="settingDisplay"></div>
  <textarea id="settingInput" placeholder="Describe the physical space, e.g. a cramped basement lit by one bare bulb, rain on the one window..." rows="2"></textarea>
  <button class="btn" onclick="setSetting()">Set setting</button>
  <button class="btn" onclick="clearSetting()">Clear</button>

  <h3>Scene focus</h3>
  <div id="focusDisplay"></div>
  <input id="focusInput" placeholder="e.g. a rumor about Priya, the storm outside...">
  <button class="btn" onclick="setFocus()">Set focus</button>
  <button class="btn" onclick="clearFocus()">Clear</button>

  <h3>Force interaction</h3>
  <select id="interactActor"></select>
  <select id="interactTarget"></select>
  <input id="interactAction" placeholder="action, e.g. shoves">
  <input id="interactDialogue" placeholder="dialogue (optional)">
  <button class="btn" onclick="forceInteraction()">Do it</button>

  <h3>Characters</h3>
  <div id="characters"></div>

  <h3>Add character</h3>
  <input id="newCharName" placeholder="Name">
  <textarea id="newCharPersona" placeholder="Persona / backstory / goals" rows="3"></textarea>
  <button class="btn" onclick="addCharacter()">Add to room</button>

  <h3>Objects</h3>
  <div id="objects"></div>

  <h3>Add object</h3>
  <input id="newObjName" placeholder="Object name">
  <textarea id="newObjDesc" placeholder="Description / what it does" rows="2"></textarea>
  <button class="btn" onclick="addObject()">Add object</button>
</div>

<div id="main">
  <div id="topbar">
    <button class="btn" onclick="toggleRun()" id="runBtn">Pause</button>
    <button class="btn" onclick="forceTick()">Force next turn</button>
    <button class="btn" onclick="generateChapter()">Write today's chapter</button>
    <a class="btn" href="/read" style="text-decoration:none;">📖 Read chapters</a>
    <span id="status" style="color:#888;font-size:12px;"></span>
  </div>
  <div id="focusBar" style="display:none;"></div>
  <div id="log"></div>
</div>

<script>
let running = true;
let lastChars = [];

function jsEscape(s) {
  return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function refresh() {
  const res = await fetch('/api/state');
  const data = await res.json();
  running = data.running;
  lastChars = data.characters;
  document.getElementById('runBtn').textContent = running ? 'Pause' : 'Resume';
  document.getElementById('status').textContent = running ? 'running' : 'paused';
  renderFocus(data.room_focus);
  renderSetting(data.room_setting);
  renderCharacters(data.characters);
  renderInteractSelectors(data.characters);
  renderObjects(data.objects);
  renderLog(data.events);
}

function renderFocus(focus) {
  const display = document.getElementById('focusDisplay');
  const bar = document.getElementById('focusBar');
  if (focus) {
    display.innerHTML = `<b>Current:</b> ${escapeHtml(focus)}`;
    bar.style.display = 'block';
    bar.innerHTML = `On people's minds: ${escapeHtml(focus)}`;
  } else {
    display.textContent = 'No focus set — characters will just do their own thing.';
    bar.style.display = 'none';
  }
}

function renderSetting(setting) {
  const display = document.getElementById('settingDisplay');
  display.textContent = setting ? setting : 'No setting described — characters have no sense of the space they\'re in.';
}

async function setSetting() {
  const setting = document.getElementById('settingInput').value.trim();
  if (!setting) return alert('Enter a setting, or use Clear to remove the current one.');
  await fetch('/api/room/setting', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ setting }) });
  document.getElementById('settingInput').value = '';
  refresh();
}
async function clearSetting() {
  await fetch('/api/room/setting', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ setting: '' }) });
  refresh();
}

function renderInteractSelectors(chars) {
  const alive = chars.filter(c => c.alive);
  const actorSel = document.getElementById('interactActor');
  const targetSel = document.getElementById('interactTarget');
  const prevActor = actorSel.value, prevTarget = targetSel.value;
  const opts = alive.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  actorSel.innerHTML = opts;
  targetSel.innerHTML = opts;
  if (alive.some(c => c.id === prevActor)) actorSel.value = prevActor;
  if (alive.some(c => c.id === prevTarget)) targetSel.value = prevTarget;
}

async function forceInteraction() {
  const actor_id = document.getElementById('interactActor').value;
  const target_id = document.getElementById('interactTarget').value;
  const action = document.getElementById('interactAction').value.trim();
  const dialogue = document.getElementById('interactDialogue').value.trim();
  if (!actor_id || !target_id) return alert('Need at least two characters in the room.');
  if (actor_id === target_id) return alert('Actor and target must be different characters.');
  if (!action && !dialogue) return alert('Enter an action or dialogue.');
  const res = await fetch('/api/interact', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ actor_id, target_id, action, dialogue }) });
  const data = await res.json();
  if (!data.ok) alert(data.reason || 'Could not do that.');
  document.getElementById('interactAction').value = '';
  document.getElementById('interactDialogue').value = '';
  refresh();
}

function renderCharacters(chars) {
  const el = document.getElementById('characters');
  el.innerHTML = chars.map(c => {
    let stateControls;
    if (c.alive) {
      stateControls = `
        <div>
          <button class="btn" onclick="intervene('${c.id}','zap')">Zap</button>
          <button class="btn" onclick="insertThought('${c.id}')">Insert thought</button>
          <button class="btn" onclick="intervene('${c.id}','disturb')">Disturb</button>
          <button class="btn" onclick="intervene('${c.id}','push')">Push</button>
          <button class="btn" onclick="intervene('${c.id}','heal')">Heal</button>
          <button class="btn" onclick="intervene('${c.id}','calm')">Calm</button>
          <button class="btn" onclick="killChar('${c.id}')">Kill</button>
        </div>
        <div>
          <button class="btn" onclick="giveDirective('${c.id}','${jsEscape(c.name)}')">${c.directive ? 'Change directive' : 'Give directive'}</button>
          ${c.directive ? `<button class="btn" onclick="clearDirective('${c.id}')">Clear directive</button>` : ''}
        </div>`;
    } else if (!c.replaced) {
      stateControls = `<div><button class="btn" onclick="replaceChar('${c.id}','${jsEscape(c.name)}')">Replace with new character</button></div>`;
    } else {
      stateControls = `<div style="font-size:11px;color:#666">replaced</div>`;
    }
    const memText = c.memory_summary ? c.memory_summary : '(no memory summary yet)';
    const memSnippet = memText.length > 90 ? memText.slice(0, 90) + '…' : memText;
    return `
      <div class="char-card ${c.alive ? '' : 'dead'}">
        <div><b>${escapeHtml(c.name)}</b> ${c.alive ? '' : '(dead)'}</div>
        <div class="bar"><div class="bar-fill health-fill" style="width:${c.health}%"></div></div>
        <div class="bar"><div class="bar-fill stability-fill" style="width:${c.stability}%"></div></div>
        ${c.status_effects.length ? `<div style="font-size:11px;color:#e0a020">
          ${c.status_effects.map(fx => `<span style="margin-right:6px;">${escapeHtml(fx)} <span style="cursor:pointer;color:#e08080;" onclick="removeStatusEffect('${c.id}','${jsEscape(fx)}')" title="Remove">✕</span></span>`).join('')}
        </div>` : ''}
        <div class="mem-snippet">memory: ${escapeHtml(memSnippet)}</div>
        ${c.directive ? `<div style="font-size:11px;color:#7fd0a0;font-style:italic;">objective: ${escapeHtml(c.directive)}</div>` : ''}
        ${stateControls}
        <div style="margin-top:4px;">
          ${c.alive ? `<button class="btn" onclick="addStatusEffect('${c.id}')">Add status effect</button>` : ''}
          <button class="btn" onclick="editMemory('${c.id}','${jsEscape(c.name)}')">Edit memory</button>
          <button class="btn btn-danger" onclick="removeChar('${c.id}','${jsEscape(c.name)}')">Remove entirely</button>
        </div>
      </div>`;
  }).join('');
}

function renderObjects(objs) {
  document.getElementById('objects').innerHTML = objs.map(o => `
    <div style="font-size:12px;margin-bottom:8px;">
      <div><b>${escapeHtml(o.name)}</b>: ${escapeHtml(o.description)}</div>
      <button class="btn" onclick="editObject('${o.id}','${jsEscape(o.name)}','${jsEscape(o.description)}')">Edit</button>
      <button class="btn btn-danger" onclick="removeObject('${o.id}','${jsEscape(o.name)}')">Remove</button>
    </div>`
  ).join('') || '<div style="font-size:12px;color:#666">none yet</div>';
}

async function editObject(id, name, description) {
  const newName = prompt('Object name:', name);
  if (newName === null) return;
  const newDesc = prompt('Object description:', description);
  if (newDesc === null) return;
  await fetch(`/api/objects/${id}/edit`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: newName.trim(), description: newDesc.trim() }) });
  refresh();
}

async function removeObject(id, name) {
  if (!confirm(`Remove "${name}" from the room?`)) return;
  await fetch(`/api/objects/${id}/delete`, { method: 'POST' });
  refresh();
}

function renderLog(events) {
  const el = document.getElementById('log');
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
  el.innerHTML = events.map(e => {
    const who = e.character_name || 'SYSTEM';
    if (e.kind === 'dialogue') return `<div class="line"><span class="who">${escapeHtml(who)}:</span> "${escapeHtml(e.content)}"</div>`;
    if (e.kind === 'action') return `<div class="line">*${escapeHtml(who)} ${escapeHtml(e.content)}*</div>`;
    if (e.kind === 'thought') return `<div class="line kind-thought">(${escapeHtml(who)} thinks: ${escapeHtml(e.content)})</div>`;
    return `<div class="line kind-${e.kind}">${escapeHtml(e.content)}</div>`;
  }).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function toggleRun() {
  await fetch(running ? '/api/pause' : '/api/resume', { method: 'POST' });
  refresh();
}
async function forceTick() { await fetch('/api/tick', { method: 'POST' }); refresh(); }

async function generateChapter() {
  const res = await fetch('/api/chapters/generate', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({}) });
  const data = await res.json();
  if (data.ok) alert(`Chapter written: "${data.chapter.title}"`);
  else alert(data.reason || 'Could not generate a chapter.');
}

async function setFocus() {
  const focus = document.getElementById('focusInput').value.trim();
  if (!focus) return alert('Enter a focus, or use Clear to remove the current one.');
  await fetch('/api/room/focus', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ focus }) });
  document.getElementById('focusInput').value = '';
  refresh();
}
async function clearFocus() {
  await fetch('/api/room/focus', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ focus: '' }) });
  refresh();
}

async function addCharacter(confirmDup) {
  const name = document.getElementById('newCharName').value.trim();
  const persona = document.getElementById('newCharPersona').value.trim();
  if (!name || !persona) return alert('Name and persona required');
  const res = await fetch('/api/characters', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, persona, confirm: !!confirmDup }) });
  const data = await res.json();
  if (!data.ok && data.duplicate) {
    if (confirm(data.reason + '\n\nOK = add another with this name. Cancel = stop.')) {
      return addCharacter(true);
    }
    return;
  }
  document.getElementById('newCharName').value = '';
  document.getElementById('newCharPersona').value = '';
  refresh();
}

async function addObject() {
  const name = document.getElementById('newObjName').value.trim();
  const description = document.getElementById('newObjDesc').value.trim();
  if (!name) return alert('Name required');
  await fetch('/api/objects', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, description }) });
  document.getElementById('newObjName').value = '';
  document.getElementById('newObjDesc').value = '';
  refresh();
}

async function intervene(id, type) {
  await fetch(`/api/characters/${id}/intervene`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type }) });
  refresh();
}
async function insertThought(id) {
  const text = prompt('Thought to insert into their mind:');
  if (!text) return;
  await fetch(`/api/characters/${id}/intervene`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type: 'insert_thought', text }) });
  refresh();
}
async function giveDirective(id, name) {
  const c = lastChars.find(x => x.id === id);
  const text = prompt(`Give ${name} an objective to actively pursue (they'll work out how, in character):`, c ? c.directive : '');
  if (text === null) return;
  await fetch(`/api/characters/${id}/directive`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text }) });
  refresh();
}
async function clearDirective(id) {
  await fetch(`/api/characters/${id}/directive`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text: '' }) });
  refresh();
}
async function addStatusEffect(id) {
  const effect = prompt('Status effect to give them (e.g. drunk, wounded, cursed):');
  if (!effect || !effect.trim()) return;
  const text = prompt('How does it happen, in a sentence (optional — leave blank for a generic line)?', '');
  await fetch(`/api/characters/${id}/status_effect/add`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ effect: effect.trim(), text: text || null }) });
  refresh();
}
async function removeStatusEffect(id, effect) {
  await fetch(`/api/characters/${id}/status_effect/remove`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ effect }) });
  refresh();
}
async function killChar(id) {
  if (!confirm('Kill this character? This is an in-story death — it gets logged and others will react to it.')) return;
  await fetch(`/api/characters/${id}/kill`, { method: 'POST' });
  refresh();
}
async function replaceChar(id, oldName) {
  const name = prompt(`New character to replace ${oldName}:`);
  if (!name) return;
  const persona = prompt('Their persona / backstory:');
  if (!persona) return;
  await fetch(`/api/characters/${id}/replace`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, persona }) });
  refresh();
}

async function editMemory(id, name) {
  const c = lastChars.find(x => x.id === id);
  const current = c ? c.memory_summary : '';
  const updated = prompt(`Edit ${name}'s memory summary (this is what they privately "remember" — clear or rewrite it to fix a stuck false belief):`, current);
  if (updated === null) return;
  await fetch(`/api/characters/${id}/memory`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ summary: updated }) });
  refresh();
}

async function removeChar(id, name) {
  const ok = confirm(
    `Permanently remove ${name}?\n\nThis deletes them and scrubs their lines from the shared log entirely — ` +
    `use it to correct a mistake (like an accidental duplicate), not for an in-story death. ` +
    `Other characters' already-formed memories of them won't be auto-corrected — use "Edit memory" on ` +
    `anyone who still believes something about them. This cannot be undone.`
  );
  if (!ok) return;
  await fetch(`/api/characters/${id}/delete`, { method: 'POST' });
  refresh();
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
